name: Frontend CI

on:
  pull_request:
    branches: [main, "feat/**"]
  push:
    branches: [main, "feat/**", "feature/**"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar Angular
        run: npm run build
      - name: Ejecutar pruebas
        run: npm test
