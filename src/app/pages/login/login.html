<div class="acceso">
  <form class="tarjeta acceso-tarjeta" [formGroup]="form" (ngSubmit)="ingresar()">
    <div class="marca marca-grande"><span class="marca-logo">S</span><span>SIGIP<small>Sistema Integral de Gestión de Impresión y Pedidos</small></span></div>
    <h1>Iniciar sesión</h1>

    <label class="campo">
      <span>Usuario</span>
      <input formControlName="nomusuario" autocomplete="username" placeholder="admin" />
      @if (form.controls.nomusuario.touched && form.controls.nomusuario.invalid) {
        <small class="error">El usuario es obligatorio</small>
      }
    </label>
    <label class="campo">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">La contraseña es obligatoria</small>
      }
    </label>

    @if (error()) {
      <p class="alerta alerta-error">{{ error() }}</p>
    }

    <button class="btn btn-primario btn-bloque" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
    <p class="texto-suave centrado">¿Eres cliente nuevo? <a routerLink="/registro">Crea tu cuenta</a></p>
  </form>
</div>
